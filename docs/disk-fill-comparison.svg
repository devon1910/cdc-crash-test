<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" role="img" aria-labelledby="title desc"><title id="title">Healthy CDC disk-fill comparison</title><desc id="desc">Two matched PostgreSQL runs in separate 256 MiB tmpfs filesystems. Without a heartbeat PostgreSQL filled the filesystem while Debezium health remained UP until the crash. With the published-table action-query heartbeat, WAL was recycled and all 30 batches completed without filling the filesystem.</desc><rect width="100%" height="100%" fill="#ffffff"/><text x="80" y="38" font-family="Segoe UI, sans-serif" font-size="25" font-weight="700" fill="#18212b">A healthy connector can still let WAL fill the disk</text><text x="80" y="65" font-family="Segoe UI, sans-serif" font-size="14" fill="#52606d">Matched disk-fill runs · 30-batch budget · 8 MiB per batch · PostgreSQL 17.11 · Debezium Server 3.6.3.Final</text><text x="112" y="97" font-family="Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#26313b">Retained-WAL distance (MB; this is not disk usage)</text><line x1="112.0" y1="285.0" x2="950.0" y2="285.0" stroke="#dce2e8"/><text x="100.0" y="285.0" text-anchor="end" dominant-baseline="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#52606d">0</text><line x1="112.0" y1="250.0" x2="950.0" y2="250.0" stroke="#dce2e8"/><text x="100.0" y="250.0" text-anchor="end" dominant-baseline="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#52606d">50</text><line x1="112.0" y1="215.0" x2="950.0" y2="215.0" stroke="#dce2e8"/><text x="100.0" y="215.0" text-anchor="end" dominant-baseline="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#52606d">100</text><line x1="112.0" y1="180.0" x2="950.0" y2="180.0" stroke="#dce2e8"/><text x="100.0" y="180.0" text-anchor="end" dominant-baseline="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#52606d">150</text><line x1="112.0" y1="145.0" x2="950.0" y2="145.0" stroke="#dce2e8"/><t